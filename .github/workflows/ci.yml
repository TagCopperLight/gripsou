name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel the older run of a PR. Runs on main get their own group: GitHub drops a queued run when a newer one joins its group, and each main commit needs its result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The checks live in ci.sh, so a local run matches. The Rust cache is saved only under a new key, which ci.sh's hash renews.
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test-core, test-rest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.part == 'lint' && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.part }}-${{ hashFiles('ci.sh') }}
      - run: ./ci.sh backend-${{ matrix.part }}

  frontend:
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test/1/2, test/2/2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - run: ./ci.sh frontend-${{ matrix.part }}
