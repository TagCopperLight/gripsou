name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gripsou
          POSTGRES_PASSWORD: gripsou
          POSTGRES_DB: gripsou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gripsou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gripsou:gripsou@localhost:5432/gripsou
      # Dummy Powens config so the provider adapter registers in tests that
      # exercise the connect path. connect() is offline (builds a URL), so the
      # values only need to be present, not real. Locally these come from .env.
      POWENS_CLIENT_ID: test-client
      POWENS_CLIENT_SECRET: test-secret
      POWENS_DOMAIN: test.biapi.pro
      POWENS_REDIRECT_URI: https://gripsou.test/connections/callback
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - name: Test
        run: cargo test
        env:
          SQLX_OFFLINE: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
