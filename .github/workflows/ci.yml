name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# A newer push to the same PR makes the older run pointless: cancel it. Every
# other run (main, the tags the release workflow calls this one for) gets a
# group of its own, because GitHub drops a *queued* run when a newer one joins
# its group even without cancel-in-progress, and each commit on main needs its
# result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gripsou
          POSTGRES_PASSWORD: gripsou
          POSTGRES_DB: gripsou
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gripsou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gripsou:gripsou@localhost:5432/gripsou
      # Dummy Powens config so the provider adapter registers in tests that
      # exercise the connect path. connect() is offline (builds a URL), so the
      # values only need to be present, not real. Locally these come from .env.
      POWENS_CLIENT_ID: test-client
      POWENS_CLIENT_SECRET: test-secret
      POWENS_DOMAIN: test.biapi.pro
      POWENS_REDIRECT_URI: https://gripsou.test/connections/callback
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      # Every #[sqlx::test] creates its own database and migrates it, and that
      # setup, not the tests themselves, is most of the test step. Two fixes,
      # both safe only because this Postgres is thrown away after the job:
      # - stop it waiting on the disk (a crash would lose data; there is none
      #   worth keeping here);
      # - migrate template1, which every new database is copied from, so each
      #   test's migrator finds everything already applied.
      # ./ci.sh skips this on purpose: it only changes the speed, and a migrated
      # template1 on a dev server goes stale when you edit an unmerged migration.
      - name: Prepare test database
        run: |
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            docker exec ${{ job.services.postgres.id }} psql -U gripsou -d gripsou -c "alter system set $setting"
          done
          docker exec ${{ job.services.postgres.id }} psql -U gripsou -d gripsou -c "select pg_reload_conf()"
          DATABASE_URL=postgres://gripsou:gripsou@localhost:5432/template1 \
            cargo run --example migrate
        env:
          SQLX_OFFLINE: "true"
      - name: Test
        run: cargo test
        env:
          SQLX_OFFLINE: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
