name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR makes the older run pointless: cancel it. Every
# run on main gets a group of its own, because GitHub drops a *queued* run when
# a newer one joins its group even without cancel-in-progress, and each commit
# on main needs its result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The checks themselves live in ci.sh, so a local run is the same as this one.
# A Rust cache is saved only under a new key: ci.sh's hash in it renews the
# cache when a job starts building something else.
jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ hashFiles('ci.sh') }}
      - run: ./ci.sh backend-lint

  backend-test:
    strategy:
      matrix:
        half: [core, rest]
    name: backend-test-${{ matrix.half }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.half }}-${{ hashFiles('ci.sh') }}
      - run: ./ci.sh backend-test-${{ matrix.half }}

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - run: ./ci.sh frontend-lint

  frontend-test:
    strategy:
      matrix:
        shard: [1/2, 2/2]
    name: frontend-test-${{ matrix.shard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - run: ./ci.sh frontend-test/${{ matrix.shard }}
