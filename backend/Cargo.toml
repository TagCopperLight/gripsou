[workspace]
resolver = "3"
members = ["core", "providers", "jobs", "api"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["fs", "cors", "trace"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "postgres", "macros", "migrate",
    "uuid", "chrono", "rust_decimal", "json",
] }
rust_decimal = { version = "1.42.0", features = ["serde-with-str", "serde-arbitrary-precision"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
anyhow = "1.0.102"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenvy = "0.15.7"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
