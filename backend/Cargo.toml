[workspace]
resolver = "3"
members = ["core", "providers", "jobs", "api", "test-macros"]

[workspace.package]
edition = "2024"
version = "1.8.1"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.53.2", features = ["full"] }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["fs", "trace", "compression-br", "compression-gzip", "set-header"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "postgres", "macros", "migrate",
    "uuid", "chrono", "rust_decimal", "json",
] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str", "serde-arbitrary-precision"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
anyhow = "1.0.104"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenvy = "0.15.7"
aes-gcm = "0.10.3"
base64 = "0.22.1"
sha2 = "0.10.9"
hmac = "0.12.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1.3"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "no-serde-warnings"] }

# Full debuginfo (a debugger's variables) slows builds by a third:
# `CARGO_PROFILE_DEV_DEBUG=2` brings it back.
[profile.dev]
debug = "line-tables-only"

# Password hashing is far too slow unoptimized: the api tests hash on almost every login.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
