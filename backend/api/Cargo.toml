[package]
name = "gripsou-api"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "gripsou"

[[bin]]
name = "gripsou"
path = "src/main.rs"

[dependencies]
gripsou-core = { path = "../core" }
gripsou-jobs = { path = "../jobs" }
anyhow.workspace = true
argon2 = { version = "0.5.3", features = ["std"] }
axum.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dotenvy.workspace = true
sha2 = "0.10.9"
base64 = "0.22.1"
totp-rs = "6.0.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
webauthn-rs-proto = "=0.5.5"
url = "2"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
