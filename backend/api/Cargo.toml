[package]
name = "gripsou-api"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "gripsou"

[[bin]]
name = "gripsou"
path = "src/main.rs"

[dependencies]
gripsou-core = { path = "../core" }
gripsou-jobs = { path = "../jobs" }
gripsou-providers = { path = "../providers" }
anyhow.workspace = true
argon2 = { version = "0.5.3", features = ["std"] }
axum = { workspace = true, features = ["macros"] }
chrono.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dotenvy.workspace = true
sha2.workspace = true
base64.workspace = true
totp-rs = "6.0.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
webauthn-rs-proto = "=0.5.5"
url = "2"

[dev-dependencies]
gripsou-jobs = { path = "../jobs", features = ["test-util"] }
async-trait.workspace = true
gripsou-core = { path = "../core", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
