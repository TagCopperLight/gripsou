name: gripsou

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gripsou
      POSTGRES_PASSWORD: gripsou
      POSTGRES_DB: gripsou
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gripsou" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://gripsou:gripsou@postgres:5432/gripsou
      BIND_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
