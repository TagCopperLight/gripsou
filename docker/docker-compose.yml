name: gripsou

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gripsou
      POSTGRES_PASSWORD: gripsou
      POSTGRES_DB: gripsou
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gripsou" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${VERSION:-}
    restart: always
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://gripsou:gripsou@postgres:5432/gripsou
      BIND_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/static
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - default
      - web

networks:
  # Shared with the central caddy (see /home/ubuntu/caddy); caddy reverse-proxies
  # gripsou.bourdet.be -> backend:8080 over this network.
  web:
    external: true

volumes:
  pgdata:
